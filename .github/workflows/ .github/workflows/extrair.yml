name: Extrair projeto TRAP VANI AI

on:
  workflow_dispatch:

jobs:
  extrair:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Obter ficheiros
        uses: actions/checkout@v4

      - name: Extrair ZIP
        run: |
          arquivo=$(find . -maxdepth 1 -iname '*.zip' -print -quit)
          if [ -z "$arquivo" ]; then
            echo "ZIP não encontrado"
            exit 1
          fi
          mkdir -p extraido
          unzip -o "$arquivo" -d extraido
          pasta=$(find extraido -mindepth 1 -maxdepth 1 -type d -print -quit)
          if [ -n "$pasta" ]; then
            cp -a "$pasta"/. .
          fi
          rm -rf extraido

      - name: Guardar ficheiros no GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extrair projeto TRAP VANI AI" || echo "Sem alterações"
          git push
